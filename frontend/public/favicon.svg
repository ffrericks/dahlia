<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#ecfdf5"/>
  <g transform="translate(32 32)" fill="#db2777">
    <!-- eight petals around the centre -->
    <g>
      <ellipse cx="0" cy="-16" rx="6" ry="12"/>
      <ellipse cx="0" cy="-16" rx="6" ry="12" transform="rotate(45)"/>
      <ellipse cx="0" cy="-16" rx="6" ry="12" transform="rotate(90)"/>
      <ellipse cx="0" cy="-16" rx="6" ry="12" transform="rotate(135)"/>
      <ellipse cx="0" cy="-16" rx="6" ry="12" transform="rotate(180)"/>
      <ellipse cx="0" cy="-16" rx="6" ry="12" transform="rotate(225)"/>
      <ellipse cx="0" cy="-16" rx="6" ry="12" transform="rotate(270)"/>
      <ellipse cx="0" cy="-16" rx="6" ry="12" transform="rotate(315)"/>
    </g>
    <circle cx="0" cy="0" r="7" fill="#f59e0b"/>
  </g>
</svg>
