[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dahlia"
version = "0.1.0"
description = "Self-hosted tool for caring for and propagating dahlias"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pillow>=11.0",
    "python-multipart>=0.0.12",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
# Ship the app package; the built frontend is copied into app/static at image build time.
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
